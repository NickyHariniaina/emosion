[project]
name = "stress-emotion-vision"
version = "0.1.0"
description = "Accurate facial emotion checker: YuNet face detection + ViT emotion (OpenCV + HuggingFace)"
readme = "README.md"
authors = [
    { name = "NickyHariniaina", email = "ferrissushi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "huggingface-hub>=1.33.0",
    "numpy",
    "opencv-python==4.12.0.88",
    "pillow",
    "safetensors>=0.8.0",
    "torch>=2.14.0",
    "transformers>=5.17.0",
]

[project.scripts]
stress-emotion-vision = "stress_emotion_vision:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/cpu"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
